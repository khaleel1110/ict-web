<div class="container mt-5">
  <h2>Paystack Payment Form</h2>
  <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()" class="mt-4">
    <!-- Full Name -->
    <div class="form-group mb-3">
      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        formControlName="fullName"
        class="form-control"
        [ngClass]="{'is-invalid': isSubmitted && formControls['fullName'].errors}"
        placeholder="Enter your full name"
      >
      <div *ngIf="isSubmitted && formControls['fullName'].errors" class="invalid-feedback">
        <div *ngIf="formControls['fullName'].errors?.['required']">Full name is required</div>
        <div *ngIf="formControls['fullName'].errors?.['minlength']">Full name must be at least 2 characters</div>
      </div>
    </div>

    <!-- Email -->
    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-control"
        [ngClass]="{'is-invalid': isSubmitted && formControls['email'].errors}"
        placeholder="Enter your email"
      >
      <div *ngIf="isSubmitted && formControls['email'].errors" class="invalid-feedback">
        <div *ngIf="formControls['email'].errors?.['required']">Email is required</div>
        <div *ngIf="formControls['email'].errors?.['email']">Please enter a valid email</div>
      </div>
    </div>

    <!-- Amount -->
    <div class="form-group mb-3">
      <label for="amount">Amount (NGN)</label>
      <input
        type="number"
        id="amount"
        formControlName="amount"
        class="form-control"
        [ngClass]="{'is-invalid': isSubmitted && formControls['amount'].errors}"
        placeholder="Enter amount"
      >
      <div *ngIf="isSubmitted && formControls['amount'].errors" class="invalid-feedback">
        <div *ngIf="formControls['amount'].errors?.['required']">Amount is required</div>
        <div *ngIf="formControls['amount'].errors?.['min']">Amount must be at least 100 NGN</div>
      </div>
    </div>

    <!-- Paystack Payment Button -->
    <div class="text-center">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="paymentForm.invalid"
      >
        Pay with Paystack
      </button>
    </div>
  </form>
</div>
